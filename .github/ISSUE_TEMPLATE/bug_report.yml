name: Bug report
description: Something did not work the way it should have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **If djgyrofix damaged a file, say so first and skip the rest of this form.**
        A patched file can almost always be recovered — the sidecar journal next
        to it holds every original byte. Try `djgyrofix verify FILE` and then
        `djgyrofix revert --force FILE`, and paste what they print.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command and its full output
      render: console
    validations:
      required: true

  - type: textarea
    id: info
    attributes:
      label: Output of `djgyrofix info --all-variants FILE`
      description: |
        This is the single most useful thing for a metadata bug: it shows the
        track layout, the sniffed variant, and what every other variant path
        would have found. Redact the filename if you like.
      render: console
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `djgyrofix version`.
      placeholder: djgyrofix 0.1.0
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: macOS 15.1 arm64
    validations:
      required: true

  - type: input
    id: camera
    attributes:
      label: Camera or drone model
      description: Variant detection is a heuristic, so the model matters.
      placeholder: DJI Mini 4 Pro
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I am not attaching footage (no unsolicited multi-GB uploads, please — `info` output is usually enough).
          required: true
