name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify; defaults to the triggering ref
        required: false
        type: string

permissions:
  contents: read

# A new push to the same branch makes the in-flight run obsolete. The parity
# and fuzz jobs are not cheap, so cancel rather than queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true
          # No go.sum to key a module cache on: this tool has no dependencies.
          cache: false
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l cmd internal tools)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      # The race detector matters here: `--jobs` runs whole files in parallel
      # and they share nothing, which is a claim worth checking.
      - name: test -race
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true
          # No go.sum to key a module cache on: this tool has no dependencies.
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  crossbuild:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true
          # No go.sum to key a module cache on: this tool has no dependencies.
          cache: false
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/djgyrofix

  fuzz:
    name: fuzz parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true
          # No go.sum to key a module cache on: this tool has no dependencies.
          cache: false
      # Both parsers walk length fields taken straight from the file, so a
      # short fuzz run on every change is cheap insurance against a panic or an
      # unbounded allocation on a corrupt clip.
      #
      # -parallel is held below the runner's core count on purpose. Go starts one
      # fuzz worker per GOMAXPROCS and the coordinator has to ping each of them;
      # with every core busy fuzzing, a worker can miss that ping and the run
      # fails with "context deadline exceeded" having found nothing. That is a
      # starved runner, not a defect in the parser, and it is indistinguishable
      # in the log from a real hang — so leave the coordinator room to breathe.
      - run: go test -run xxx -fuzz FuzzParseTracks -fuzztime 90s -parallel 2 ./internal/mp4/
      - run: go test -run xxx -fuzz FuzzQuaternions -fuzztime 90s -parallel 2 ./internal/djiproto/

  parity:
    name: golden parity against the Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          check-latest: true
          # No go.sum to key a module cache on: this tool has no dependencies.
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: clone the reference implementation
        run: git clone --depth 1 https://github.com/kim2160/DJIGyroFix.git "$RUNNER_TEMP/reference"
      # With detection disabled and explicit --ranges, output must be
      # byte-identical to gyrofix.cli. This is the gate that guards the port.
      - name: parity sweep
        run: ./testdata/golden/parity.sh "$RUNNER_TEMP/reference"
